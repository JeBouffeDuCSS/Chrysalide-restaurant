<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 140" role="img" aria-label="Chrysalide">
    <!-- Wordmark -->
    <text x="200" y="78" font-family="'Cormorant Garamond', Georgia, serif" font-size="64" font-weight="400" text-anchor="middle" fill="#611b08" letter-spacing="2">Chrysalide</text>
    <!-- Séparateurs fins en terracotta + crôute brisée vue de côté (cercle sectionné) -->
    <line x1="125" y1="110" x2="180" y2="110" stroke="#c46a4a" stroke-width="1.2"/>
    <line x1="220" y1="110" x2="275" y2="110" stroke="#c46a4a" stroke-width="1.2"/>
    <!-- Cercle stylisé : croûte brisée -->
    <path d="M 188 110 Q 195 102 200 110 Q 205 118 212 110" fill="none" stroke="#c46a4a" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="200" cy="110" r="9" fill="none" stroke="#c46a4a" stroke-width="1.2" opacity="0.5"/>
</svg>
